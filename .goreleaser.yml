version: 2

project_name: xray-geodata-cut

before:
  hooks:
    - make dep

builds:
  - id: xray-geodata-cut
    binary: xray-geodata-cut
    main: ./
    goarch:
      - amd64
      - arm64
      - arm
    goos:
      - linux
      - windows
      - darwin
    ignore:
      - goarch: arm
        goos: linux
      - goarch: arm64
        goos: linux
      - goarch: arm
        goos: windows
      - goarch: arm64
        goos: windows
    env:
      - CGO_ENABLED=0
    ldflags:
      - -a

archives:
  - id: xray-geodata-cut
    ids: [xray-geodata-cut]
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      group: root
      owner: root
    wrap_in_directory: false
    files:
      - README.md
    name_template: >-
      {{- .Binary }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}"
  format: tar.gz

checksum:
  name_template: 'checksums.txt'

nfpms:
  - vendor: xray-geodata-cut
    description: xray-geodata-cut - Cut unneeded data from geoip.dat or geosite.dat, or build geoip.dat from ASNs.
    formats: []
    bindir: /usr/sbin
